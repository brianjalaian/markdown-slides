<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Neural Networks: From Neurons to Backpropagation</title>
  <link rel="stylesheet" href="../reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../reveal.js/dist/theme/black.css">
  <link rel="stylesheet" href="../reveal.js/plugin/highlight/monokai.css">
  <style>
    :root { --cyan:#8be9fd; --purple:#bd93f9; --green:#50fa7b; --orange:#ffb86c; --pink:#ff79c6; --panel:#282a36; --muted:#a9b1c6; }
    .reveal { font-size:32px; }
    .reveal h1 { color:var(--cyan); font-size:1.8em; }
    .reveal h2 { color:var(--purple); font-size:1.5em; }
    .reveal h3 { color:var(--green); font-size:1.2em; }
    .reveal strong { color:var(--orange); }
    .reveal em { color:#f1fa8c; }
    .reveal ul,.reveal ol { font-size:.85em; }
    .reveal li { margin-bottom:.3em; line-height:1.3; }
    .reveal table { margin:.45em auto; border-collapse:collapse; font-size:.72em; width:94%; }
    .reveal th { background:#44475a; color:var(--pink); }
    .reveal th,.reveal td { padding:8px 10px; border:1px solid rgba(255,255,255,.18); line-height:1.2; }
    .source { position:absolute; bottom:8px; left:18px; color:#8991a8; font-size:.42em; }
    .slide-no { position:absolute; bottom:8px; right:18px; color:#8991a8; font-size:.55em; }
    .flow-row { display:flex; align-items:center; justify-content:center; gap:18px; margin:1.1em auto; }
    .flow-row.compact { margin:.8em auto; }
    .flow-box { min-width:190px; padding:18px 16px; border:2px solid var(--cyan); border-radius:12px; background:rgba(139,233,253,.08); }
    .flow-box.accent { border-color:var(--purple); background:rgba(189,147,249,.09); }
    .flow-box.green { border-color:var(--green); background:rgba(80,250,123,.08); }
    .flow-box small { display:block; color:var(--muted); margin-top:7px; }
    .arrow { color:var(--orange); font-size:1.4em; font-weight:bold; }
    .key,.checkpoint { border-left:4px solid var(--orange); background:rgba(255,184,108,.10); padding:13px 18px; margin:18px auto 0; width:88%; font-size:.78em; text-align:left; }
    .checkpoint { border-color:var(--green); background:rgba(80,250,123,.08); }
    .network { display:flex; align-items:center; justify-content:center; gap:18px; margin:1.1em auto; }
    .layer { width:185px; padding:16px 8px; border:2px solid var(--cyan); border-radius:50%; background:rgba(139,233,253,.09); }
    .layer.hidden { border-color:var(--purple); background:rgba(189,147,249,.10); }
    .layer.output { border-color:var(--green); background:rgba(80,250,123,.08); }
    .layer b,.layer span,.layer i { display:block; }
    .layer span { color:var(--orange); margin:5px 0; }
    .layer i { color:var(--muted); font-size:.58em; }
    .connector { color:var(--muted); font-size:.65em; }
    .smallnet .layer { width:165px; }
    .xor-grid { display:grid; grid-template-columns:110px 110px; gap:10px; justify-content:center; margin:.5em auto; }
    .xor-grid div { border-radius:8px; padding:8px; font-weight:bold; }
    .xor-grid small { font-size:.55em; color:#f8f8f2; }
    .xor-grid .zero { background:#44475a; }
    .xor-grid .one { background:#5c3d79; color:var(--green); }
    .loop { display:grid; grid-template-columns:repeat(4,1fr); gap:15px; margin:1.2em auto; }
    .loop div { padding:18px 8px; border:2px solid var(--purple); border-radius:12px; background:rgba(189,147,249,.08); }
    .loop small { color:var(--muted); }
    .three-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:1.1em auto; }
    .three-cards div { padding:18px 10px; border:2px solid var(--orange); border-radius:12px; }
    .three-cards .good { border-color:var(--green); }
    .three-cards .bad { border-color:#ff5555; }
    .three-cards b,.three-cards span,.three-cards i { display:block; }
    .three-cards span { font-size:.72em; margin:8px 0; }
    .three-cards i { color:var(--muted); font-size:.58em; }
    .refs { font-size:.69em; text-align:left; }
    .refs li { margin-bottom:.45em; }
    .reveal code { color:#f8f8f2; }
    .reveal .math { text-shadow:none; }
  </style>
</head>
<body>
  <div class="reveal"><div class="slides">
    <section id="slides-section" data-separator="^---$" data-separator-vertical="^--$" data-charset="utf-8">
      <script type="text/template"></script>
    </section>
  </div></div>
  <script>
    const section=document.getElementById('slides-section');
    const params=new URLSearchParams(window.location.search);
    const host=window.location.hostname;
    const isLocalhost=host==='localhost'||host==='127.0.0.1'||host==='';
    const useLocal=params.has('local')||(isLocalhost&&!params.has('public'));
    section.setAttribute('data-markdown',useLocal?'slides.local.md':'slides.md');
  </script>
  <script src="../reveal.js/dist/reveal.js"></script>
  <script src="../reveal.js/plugin/markdown/markdown.js"></script>
  <script src="../reveal.js/plugin/highlight/highlight.js"></script>
  <script src="../reveal.js/plugin/math/math.js"></script>
  <script src="../reveal.js/plugin/notes/notes.js"></script>
  <script>
    Reveal.initialize({plugins:[RevealMarkdown,RevealHighlight,RevealMath.MathJax3,RevealNotes],width:1280,height:900,margin:.03,markdown:{separator:'^---$',separatorVertical:'^--$',highlightLines:true},highlight:{theme:'monokai',numberLines:true}});
  </script>
</body>
</html>
